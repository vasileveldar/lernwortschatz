<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101112">
  <title>Lernwortschatz</title>
  <style>
/* Lernwortschatz — оформление в стиле приложения «Расписание» (палитра «Графит», одна тема). */
:root {
  color-scheme: dark;
  --ink: #ececec; --muted: #a6a8ab; --line: #35383c; --paper: #17181a; --surface: #222427; --controls: #1d1f21;
  --header: #101112; --header-shade: #26282b;
  --accent: #d4d7dc; --accent-soft: #b8bcc4; --accent-dim: #2f3135;
  --button: #2c2e32; --button-border: #45484d; --button-hover: #383b3f;
  --selected: #e8e9eb; --selected-text: #17181a;
  --ok: #8fbf9f; --ok-bg: #23302a; --bad: #d49595; --bad-bg: #36262a; --warn: #d1b27a;
  --r-lg: 18px; --r-md: 14px; --r-sm: 10px;
  --sh-1: 0 1px 2px #0006, 0 8px 22px #00000050;
  --sh-2: 0 2px 4px #0007, 0 18px 40px #00000070;
  --ease: cubic-bezier(.2, .75, .25, 1);
  --tab-h: 64px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; overflow-x: clip; }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-size: 15px; line-height: 1.5;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 18px); -webkit-tap-highlight-color: transparent; overflow-x: clip; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- шапка ---------- */
header { position: relative; isolation: isolate; overflow: hidden; background: var(--header); color: #fffdf7;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 20px 24px; border-bottom: 4px solid var(--accent-dim); }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 4px; z-index: 1;
  background: linear-gradient(90deg, var(--accent) 0 64%, var(--accent-soft) 64% 82%, var(--accent-dim) 82% 100%); }
.fx-glow { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .6; mix-blend-mode: screen;
  background: radial-gradient(60% 130% at 88% -15%, var(--g1, #7fb6ff55), transparent 62%), radial-gradient(50% 110% at 8% 115%, var(--g2, #ffffff22), transparent 62%);
  animation: drift 22s ease-in-out infinite alternate; }
html[data-tod="morning"] { --g1: #ffb86b55; --g2: #ffd9a02a; }
html[data-tod="day"] { --g1: #7fb6ff44; --g2: #ffffff1c; }
html[data-tod="evening"] { --g1: #ff7a9c44; --g2: #b07aff2a; }
html[data-tod="night"] { --g1: #5c6cff38; --g2: #2a3a8f3a; }
@keyframes drift { to { transform: translate(-3%, 4%) scale(1.08); opacity: .75; } }
.inner { position: relative; max-width: 1040px; margin: 0 auto; padding-right: 64px; }
.eyebrow { margin: 0 0 6px; font-size: 11px; letter-spacing: .17em; text-transform: uppercase; color: #d3d9e3; font-weight: 650; }
h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(28px, 6vw, 38px); letter-spacing: -.025em; line-height: 1.15; font-weight: 700; }
.subtitle { margin: 8px 0 0; font-size: 14px; color: #c9ced6; min-height: 21px; }
.ring { position: absolute; right: 0; top: 50%; translate: 0 -50%; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; }
.ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--ok) calc(var(--p, 0) * 360deg), #ffffff1f 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
.ring { transition: --p .9s ease; }
.ring span { position: relative; font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }

/* ---------- ленты лекций ---------- */
.decks-wrap { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.decks { display: flex; gap: 8px; max-width: 1040px; margin: 0 auto; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
.decks::-webkit-scrollbar { display: none; }
.pill { position: relative; flex: none; min-width: 44px; min-height: 40px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--button-border); background: var(--button);
  color: var(--ink); font-weight: 650; font-size: 15px; font-variant-numeric: tabular-nums; scroll-snap-align: center; overflow: hidden;
  transition: background-color .2s, color .2s, border-color .2s, transform .14s var(--ease); }
.pill:hover { background: var(--button-hover); }
.pill:active { transform: scale(.96); }
.pill[aria-selected="true"] { background: var(--selected); color: var(--selected-text); border-color: transparent; }
.pill.done:not([aria-selected="true"])::after { content: ""; position: absolute; right: 7px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 0; overflow-x: clip; }
.view { display: none; }
.view.on { display: block; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
.bar .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--button-border); background: var(--button); font-size: 13px; font-weight: 600; color: var(--muted); transition: background-color .2s, color .2s; }
.switch[aria-pressed="true"] { background: var(--accent-dim); color: var(--warn); border-color: #5b5640; }
.switch svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.switch[aria-pressed="true"] svg { fill: currentColor; }

/* ---------- кнопки ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: var(--r-md);
  border: 1px solid var(--button-border); background: var(--button); font-weight: 650; font-size: 15px; transition: background-color .2s, border-color .2s, transform .14s var(--ease), box-shadow .2s; }
.btn:hover { background: var(--button-hover); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--selected); color: var(--selected-text); border-color: transparent; }
.btn.primary:hover { background: #fff; }
.btn.ok { background: var(--ok-bg); color: var(--ok); border-color: #3b5446; }
.btn.bad { background: var(--bad-bg); color: var(--bad); border-color: #5a3a40; }
.btn.ok.on { background: var(--ok); color: #12201a; border-color: transparent; }
.icon-btn { position: relative; overflow: hidden; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--controls); color: var(--muted); transition: color .2s, background-color .2s, transform .14s var(--ease); }
.icon-btn:hover { color: var(--ink); background: var(--button); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.star.on { color: var(--warn); }
.icon-btn.star.on svg { fill: currentColor; }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .16; transform: scale(0); pointer-events: none; animation: rip .55s ease-out forwards; }
@keyframes rip { to { transform: scale(1); opacity: 0; } }

/* ---------- карточка ---------- */
.meter { display: flex; align-items: center; gap: 12px; max-width: 560px; margin: 0 auto 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter b { color: var(--ink); font-weight: 700; }
.track { flex: 1; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--accent-soft), var(--accent)); transition: width .4s var(--ease); }
.scene { max-width: 560px; margin: 0 auto; height: min(52vh, 380px); min-height: 300px; perspective: 1100px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
.flip { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s var(--ease); }
.flip.back { transform: rotateY(180deg); }
.flip.no-tr { transition: none; }
.face { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 18px 20px 20px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-2);
  backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.face.rev { transform: rotateY(180deg); background: linear-gradient(160deg, #2a2d31, #202225); }
.face-top { display: flex; align-items: center; justify-content: space-between; min-height: 46px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 999px; background: var(--accent-dim); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.chip.learned { background: var(--ok-bg); color: var(--ok); }
.face-tools { display: flex; gap: 8px; }
.face-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 4px 4px; min-height: 0; overflow: auto; }
.word { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 9vw, 52px); font-weight: 700; letter-spacing: -.02em; line-height: 1.12; overflow-wrap: anywhere; }
.word.long { font-size: clamp(24px, 6.4vw, 34px); }
.hint { margin: 0; font-size: 13px; color: var(--muted); background: var(--accent-dim); padding: 6px 14px; border-radius: 999px; }
.full { font-family: Georgia, "Times New Roman", serif; font-size: clamp(22px, 6vw, 30px); font-weight: 700; overflow-wrap: anywhere; }
.forms { display: inline-block; font-size: 13px; font-weight: 650; color: var(--warn); background: #2f2c22; border: 1px solid #4a4432; padding: 5px 12px; border-radius: 999px; }
.tr { margin: 0; font-size: clamp(22px, 6vw, 28px); font-weight: 650; color: var(--accent); overflow-wrap: anywhere; }
.gram { margin: 0; font-size: 12px; color: var(--muted); }
.example { font-size: 14px; color: #d4d6d9; background: #ffffff0a; border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; max-width: 420px; }
.example b { color: var(--muted); font-weight: 650; margin-right: 4px; }
.face-foot { text-align: center; font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.controls { max-width: 560px; margin: 16px auto 0; display: grid; grid-template-columns: 52px 1fr 1fr 52px; gap: 10px; align-items: center; }
.controls .icon-btn { width: 52px; height: 52px; }
.empty { text-align: center; color: var(--muted); padding: 48px 20px; }
.empty svg { width: 64px; height: 64px; opacity: .6; margin-bottom: 8px; }

/* ---------- тест ---------- */
.quiz { max-width: 560px; margin: 0 auto; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 0 0 16px; }
.dots i { width: 22px; height: 6px; border-radius: 6px; background: var(--line); transition: background-color .3s, transform .3s var(--ease); }
.dots i.cur { background: var(--accent-soft); transform: scaleY(1.5); }
.dots i.ok { background: var(--ok); }
.dots i.bad { background: var(--bad); }
.q-card { text-align: center; padding: 26px 18px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-1); margin-bottom: 14px; }
.q-card .word { font-size: clamp(30px, 8vw, 44px); }
.q-card .forms { margin-top: 10px; min-height: 28px; }
.opts { display: grid; gap: 10px; }
.opt { position: relative; overflow: hidden; width: 100%; min-height: 54px; padding: 12px 16px; text-align: left; border-radius: var(--r-md); border: 1px solid var(--button-border); background: var(--button); font-size: 16px; font-weight: 600; transition: background-color .2s, border-color .2s, transform .14s var(--ease), color .2s; }
.opt:hover:not(:disabled) { background: var(--button-hover); }
.opt:active:not(:disabled) { transform: scale(.98); }
.opt:disabled { cursor: default; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); animation: shake .4s; }
@keyframes shake { 20%, 60% { translate: -6px 0; } 40%, 80% { translate: 6px 0; } }
.quiz .btn.primary { width: 100%; margin-top: 14px; }
.result { text-align: center; padding: 30px 18px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-1); }
.result .ring { position: relative; right: auto; top: auto; translate: none; margin: 0 auto 14px; width: 96px; height: 96px; }
.result .ring::before { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px)); mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px)); }
.result .ring span { font-size: 24px; }
.result h2 { margin: 0 0 6px; font-family: Georgia, serif; font-size: 26px; }
.result p { margin: 0 0 16px; color: var(--muted); }
.confetti { position: fixed; inset: 0; z-index: 95; width: 100%; height: 100%; pointer-events: none; }

/* ---------- список и глаголы ---------- */
.search { display: block; width: 100%; min-height: 48px; padding: 0 16px; margin: 0 0 12px; border-radius: var(--r-md); border: 1px solid var(--button-border); background: var(--controls); font-size: 16px; }
.search::placeholder { color: var(--muted); }
.grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.row { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-1); content-visibility: auto; contain-intrinsic-size: auto 100px; transition: border-color .2s, transform .14s var(--ease); }
.row:hover { border-color: var(--button-border); }
.row.in { animation: up .42s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms); }
@keyframes up { from { opacity: 0; transform: translateY(10px); } }
.row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.row h4 { margin: 0; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.row .sub { margin: 2px 0 0; font-size: 12px; color: var(--warn); }
.row .rtr { font-size: 14px; color: var(--accent); font-weight: 600; }
.row .rex { margin: 0; font-size: 12px; color: var(--muted); font-style: italic; }
.row .tick { font-size: 12px; color: var(--ok); font-weight: 650; }
.row .icon-btn { width: 40px; height: 40px; flex: none; }
.row-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.lead { margin: 0 0 14px; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-1); }
.lead h2 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 22px; }
.lead p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.lead .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters .pill { min-height: 36px; font-size: 13px; padding: 0 13px; }
.vforms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.vf { padding: 8px 10px; border-radius: var(--r-sm); background: var(--accent-dim); border: 1px solid var(--line); }
.vf span { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 650; }
.vf b { display: block; margin-top: 2px; font-size: 14px; overflow-wrap: anywhere; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--accent-dim); color: var(--muted); border: 1px solid var(--line); }
.badge.sein { color: var(--accent); background: #26292d; }
.badge.both { color: var(--warn); background: #2f2c22; border-color: #4a4432; }
.num { color: var(--muted); font-size: 12px; font-weight: 700; margin-right: 6px; }

/* ---------- нижняя панель ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--controls) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
.tabs { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 560px; }
.tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border-radius: 14px; color: var(--muted); font-size: 11px; font-weight: 650; transition: color .2s, transform .14s var(--ease); }
.tab:active { transform: scale(.94); }
.tab[aria-current="page"] { color: var(--accent); }
.ind { position: absolute; z-index: 0; top: 0; bottom: 0; left: 0; width: 25%; border-radius: 14px; background: #ffffff10; transition: transform .32s var(--ease); }

/* ---------- уведомления ---------- */
.toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 14px); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { padding: 10px 16px; border-radius: 999px; background: var(--selected); color: var(--selected-text); font-size: 13px; font-weight: 650; box-shadow: var(--sh-2); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  </style>

<body>
  <header>
    <div class="fx-glow" aria-hidden="true"></div>
    <div class="inner">
      <p class="eyebrow" id="hd-eyebrow">Лекция 1</p>
      <h1>Lernwortschatz</h1>
      <p class="subtitle" id="hd-sub"></p>
      <div class="ring" id="hd-ring" role="img" aria-label="Прогресс лекции"><span id="hd-ring-text">0%</span></div>
    </div>
  </header>

  <div class="decks-wrap"><div class="decks" id="decks" role="tablist" aria-label="Лекции"></div></div>

  <main>
    <!-- Карточки -->
    <section id="view-cards" class="view on" aria-label="Карточки">
      <div class="bar">
        <span class="count" id="cards-learned">Изучено: 0 из 0</span>
        <button class="switch" id="btn-fav" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path stroke-linejoin="round" d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/></svg>
          Избранное <span id="fav-count">0</span>
        </button>
      </div>
      <div class="meter"><span id="card-counter"><b>1</b> / 1</span><div class="track"><i id="progress-fill"></i></div></div>
      <div class="scene" id="scene" aria-live="polite">
        <div class="flip" id="flip">
          <div class="face" id="face-front">
            <div class="face-top">
              <span class="chip" id="chip-front">Слово</span>
              <div class="face-tools">
                <button class="icon-btn star" id="btn-star" type="button" aria-label="В избранное"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/></svg></button>
                <button class="icon-btn" id="btn-speak" type="button" aria-label="Озвучить"><svg class="i" viewBox="0 0 24 24"><path d="M5.6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h1.6l4.7-4.7c.6-.6 1.7-.2 1.7.7v14c0 .9-1.1 1.3-1.7.7zM15.5 8.5a5 5 0 0 1 0 7M18.4 5.6a9 9 0 0 1 0 12.8"/></svg></button>
              </div>
            </div>
            <div class="face-mid">
              <h2 class="word" id="front-word">—</h2>
              <p class="hint" id="front-hint"></p>
            </div>
            <div class="face-foot"><svg class="i" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M4 4v5h5M20 20v-5h-5M5.5 9A8 8 0 0 1 19 7M18.5 15A8 8 0 0 1 5 17"/></svg>Коснитесь, чтобы увидеть ответ</div>
          </div>
          <div class="face rev" id="face-back">
            <div class="face-top">
              <span class="chip" id="chip-back">Ответ</span>
              <div class="face-tools">
                <button class="icon-btn" id="btn-speak-back" type="button" aria-label="Озвучить"><svg class="i" viewBox="0 0 24 24"><path d="M5.6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h1.6l4.7-4.7c.6-.6 1.7-.2 1.7.7v14c0 .9-1.1 1.3-1.7.7zM15.5 8.5a5 5 0 0 1 0 7M18.4 5.6a9 9 0 0 1 0 12.8"/></svg></button>

// ============================================================ утилиты
const $ = id => document.getElementById(id);
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
const EASE = 'cubic-bezier(.2,.75,.25,1)';

function play(node, frames, options) {
  if (!node || reduced.matches || typeof node.animate !== 'function') return null;
  try { return node.animate(frames, Object.assign({ duration: 260, easing: EASE, fill: 'backwards' }, options || {})); } catch (e) { return null; }
}
function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) { /* нет вибрации */ } }
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function showToast(message) {
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  box.appendChild(el);
  play(el, [{ opacity: 0, transform: 'translateY(10px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 220 });
  setTimeout(() => {
    const a = play(el, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(6px)' }], { duration: 220, fill: 'forwards' });
    setTimeout(() => el.remove(), a ? 230 : 0);
  }, 2200);
}

// волна при нажатии
document.addEventListener('pointerdown', e => {
  const host = e.target.closest('.btn, .icon-btn, .pill, .opt, .switch');
  if (!host || reduced.matches || host.disabled) return;
  const r = host.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 2;
  const wave = document.createElement('span');
  wave.className = 'ripple';
  wave.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  host.appendChild(wave);
  setTimeout(() => wave.remove(), 600);
}, { passive: true });

// время суток — оттенок свечения шапки
(function () {
  const h = new Date().getHours();
  document.documentElement.dataset.tod = h >= 5 && h < 11 ? 'morning' : h < 17 ? 'day' : h < 22 ? 'evening' : 'night';
})();

// конфетти
function confetti() {
  if (reduced.matches) return;
  const cv = document.createElement('canvas');
  cv.className = 'confetti';
  const w = cv.width = innerWidth, h = cv.height = innerHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const colors = ['#d4d7dc', '#8fbf9f', '#d1b27a', '#8fb0c9', '#cc8b8b'];
  const parts = Array.from({ length: 90 }, () => ({ x: w / 2, y: h * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 3, s: Math.random() * 7 + 4, c: colors[Math.floor(Math.random() * colors.length)], r: Math.random() * 6, vr: (Math.random() - .5) * .4 }));
  let t = 0;
  (function frame() {
    ctx.clearRect(0, 0, w, h);
    parts.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / 110); ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
    if (++t < 110) requestAnimationFrame(frame); else cv.remove();
  })();
}

// ============================================================ хранилище (устройство + облако Telegram подключается из tg-sync.js)
const DB_NAME = 'LernwortschatzOfflineDB';
const DB_STORE = 'app_state';

function openLocalIndexedDB() {
  return new Promise(resolve => {
    if (!('indexedDB' in window)) return resolve(null);
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => resolve(null);
    } catch (err) { resolve(null); }
  });
}
async function saveToIndexedDB(key, val) {
  const db = await openLocalIndexedDB();
  if (!db) return;
  try { db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(val, key); } catch (e) { /* не критично */ }
}
async function loadFromIndexedDB(key) {
  const db = await openLocalIndexedDB();
  if (!db) return null;
  return new Promise(resolve => {
    try {
      const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

let isFlipped = false;
let onlyFav = false;
let learnedSet = new Set();
let starredSet = new Set();
let currentView = 'cards';

function serializeFullState() {
  return { version: 4, updatedAt: Date.now(), activeDeckId, learned: [...learnedSet], starred: [...starredSet] };
}
function applyFullStateObject(st) {
  if (!st || typeof st !== 'object') return;
  if (Array.isArray(st.learned)) learnedSet = new Set(st.learned);
  if (Array.isArray(st.starred)) starredSet = new Set(st.starred);
  if (st.activeDeckId && decks[st.activeDeckId]) activeDeckId = st.activeDeckId;
}
function saveState() {
  const full = serializeFullState();
  const json = JSON.stringify(full);
  try { localStorage.setItem('de_full_state_v3', json); } catch (e) { /* приватный режим */ }
  saveToIndexedDB('full_state_v3', full);
  try { if (window.AndroidBridge && typeof window.AndroidBridge.saveState === 'function') window.AndroidBridge.saveState(json); } catch (e) { /* не в APK */ }
  updateHeaderStats();
}
async function initStorageAndRestore() {
  let restored = false;
  try {
    if (window.AndroidBridge && typeof window.AndroidBridge.loadState === 'function') {
      const nat = window.AndroidBridge.loadState();
      if (nat) { applyFullStateObject(JSON.parse(nat)); restored = true; }
    }
  } catch (e) { /* нет моста */ }
  if (!restored) {
    try {
      const saved = localStorage.getItem('de_full_state_v3');
      if (saved) { applyFullStateObject(JSON.parse(saved)); restored = true; }
    } catch (e) { /* пусто */ }
  }
  const idb = await loadFromIndexedDB('full_state_v3');
  if (idb && (!restored || (idb.updatedAt && idb.updatedAt > 0))) applyFullStateObject(idb);
  if (!decks[activeDeckId]) activeDeckId = FIRST_DECK_ID;
  cardsData = [...decks[activeDeckId].cards];
  rebuildCurrent();
  renderDecks();
  updateHeaderStats();
  renderCard();
  scrollActivePill(true);
}

// ============================================================ озвучка: нативный TTS (APK) или голос de-DE
let germanVoice = null;
function pickGermanVoice() {
  try {
    const voices = window.speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('de'));
    if (!voices.length) return null;
    const score = v => (/google|natural|neural|online/i.test(v.name) ? 2 : 0) + (/de-de/i.test(v.lang.replace('_', '-')) ? 1 : 0) - (/compact/i.test(v.name) ? 1 : 0);
    return voices.sort((a, b) => score(b) - score(a))[0];
  } catch (e) { return null; }
}
if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => { germanVoice = pickGermanVoice(); };
function speakText(text) {
  // убираем пометки множественного числа («-n», «¨-e») и скобки, но сохраняем все формы глагола
  const clean = String(text || '').replace(/\(.*?\)/g, '').split(',').filter(p => !/^\s*[¨\-–]/.test(p)).join(', ').replace(/\s+/g, ' ').trim();
  if (!clean) return;
  try {
    if (window.AndroidBridge && typeof window.AndroidBridge.speakGerman === 'function') {
      if (window.AndroidBridge.speakGerman(clean) === true) return;
    }
  } catch (e) { /* нет моста */ }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'de-DE';
    u.rate = 0.85;
    if (!germanVoice) germanVoice = pickGermanVoice();
    if (germanVoice) u.voice = germanVoice;
    window.speechSynthesis.speak(u);
  }
}

// ============================================================ лекции
function deckLabel(id) {
  if (id === STRONG_ID) return 'Глаголы';
  return String(parseInt(id.replace(/\D+/g, ''), 10));
}
function deckParts(deck) {
  const parts = deck.name.split(' · ');
  return { head: parts[0], topic: parts.slice(1).join(' · ') };
}
function deckProgress(deck) {
  const total = deck.cards.length || 1;
  const done = deck.cards.reduce((n, c) => n + (learnedSet.has(c.front) ? 1 : 0), 0);
  return { done, total, ratio: done / total };
}
function renderDecks() {
  const box = $('decks');
  box.innerHTML = Object.keys(decks).map(id => {
    const p = deckProgress(decks[id]);
    return `<button class="pill${p.done === p.total ? ' done' : ''}" role="tab" data-deck="${id}" aria-selected="${id === activeDeckId}" type="button" aria-label="${esc(decks[id].name)}">${deckLabel(id)}</button>`;
  }).join('');
}
function scrollActivePill(instant) {
  // двигаем только ленту лекций: scrollIntoView прокручивал бы и всю страницу, и нижняя панель «дёргалась»
  const box = $('decks');
  const pill = box.querySelector('.pill[data-deck][aria-selected="true"]');
  if (!pill) return;
  box.scrollTo({ left: pill.offsetLeft - (box.clientWidth - pill.offsetWidth) / 2, behavior: instant || reduced.matches ? 'auto' : 'smooth' });
}
function updateHeaderStats() {
  const deck = decks[activeDeckId];
  const { head, topic } = deckParts(deck);
  const p = deckProgress(deck);
  $('hd-eyebrow').textContent = head;
  $('hd-sub').textContent = `${topic ? topic + ' · ' : ''}${deck.cards.length} ${plural(deck.cards.length, 'слово', 'слова', 'слов')}`;
  $('hd-ring').style.setProperty('--p', p.ratio.toFixed(3));
  $('hd-ring-text').textContent = Math.round(p.ratio * 100) + '%';
  $('cards-learned').textContent = `Изучено: ${p.done} из ${p.total}`;
  $('fav-count').textContent = cardsData.filter(c => starredSet.has(c.front)).length;
  const done = document.querySelectorAll('.pill[data-deck]');
  done.forEach(btn => { const d = decks[btn.dataset.deck]; if (d) { const q = deckProgress(d); btn.classList.toggle('done', q.done === q.total); } });
}
function rebuildCurrent() {
  currentCards = onlyFav ? cardsData.filter(c => starredSet.has(c.front)) : [...cardsData];
  if (currentIndex >= currentCards.length) currentIndex = 0;
}
function switchDeck(deckId) {
  if (!decks[deckId]) return;
  activeDeckId = deckId;
  cardsData = [...decks[deckId].cards];
  currentIndex = 0;
  rebuildCurrent();
  renderDecks();
  updateHeaderStats();
  scrollActivePill();
  renderCard('next');
  renderListView();
  if (currentView === 'quiz') startQuiz();
  saveState();
}

// ============================================================ карточка
function getFrontQuestionText(card) {
  const raw = (card.front || '').trim();
  if (card.type === 'nomen' || /^(der|die|das)\s+/i.test(raw)) {
    const reg = raw.match(/\((CH|A|D)\)/i);
    const noun = raw.replace(/^\(?(der|die|das)\)?\s+/i, '').split(',')[0].replace(/\((CH|A|D)\)/i, '').trim();
    return noun + (reg ? ' ' + reg[0] : '');
  }
  return raw;
}
function frontHint(card) {
  if (card.type === 'nomen' || /^(der|die|das)\s+/i.test(card.front)) return 'Вспомните артикль, мн. число и перевод';
  if (card.type === 'verben') return 'Вспомните формы глагола и перевод';
  if (card.type === 'praepositionen') return 'Вспомните падеж и перевод';
  return '';
}

function renderCard(dir) {
  const flip = $('flip');
  const scene = $('scene');
  const empty = !currentCards.length;
  $('face-front').style.visibility = $('face-back').style.visibility = '';
  if (empty) {
    $('front-word').textContent = onlyFav ? 'В избранном пока пусто' : 'Нет карточек';
    $('front-word').classList.add('long');
    $('front-hint').textContent = onlyFav ? 'Отмечайте слова звёздочкой — они появятся здесь' : '';
    $('front-hint').hidden = !onlyFav;
    $('chip-front').textContent = '—';
    $('card-counter').innerHTML = '<b>0</b> / 0';
    $('progress-fill').style.width = '0%';
    flip.classList.remove('back'); isFlipped = false;
    return;
  }
  if (currentIndex >= currentCards.length) currentIndex = 0;
  const card = currentCards[currentIndex];

  // мгновенно возвращаем лицевую сторону, чтобы ответ не «просвечивал»
  if (isFlipped || flip.classList.contains('back')) {
    flip.classList.add('no-tr');
    $('face-back').style.visibility = 'hidden';
    flip.classList.remove('back');
    isFlipped = false;
    void flip.offsetHeight;
    requestAnimationFrame(() => { flip.classList.remove('no-tr'); $('face-back').style.visibility = ''; });
  }
  if (dir) {
    play(scene, [{ opacity: 0, transform: `translateX(${dir === 'next' ? 22 : -22}px) scale(.97)` }, { opacity: 1, transform: 'none' }], { duration: 300 });
  }

  const word = getFrontQuestionText(card);
  const fw = $('front-word');
  fw.textContent = word;
  fw.classList.toggle('long', word.length > 14);
  const hint = frontHint(card);
  $('front-hint').textContent = hint;
  $('front-hint').hidden = !hint;

  const learned = learnedSet.has(card.front);
  const chip = $('chip-front');
  chip.textContent = learned ? '✓ Изучено' : `${decks[activeDeckId] === decks[STRONG_ID] ? 'Глагол' : 'Слово'}`;
  chip.classList.toggle('learned', learned);

  $('back-full').textContent = card.front;
  const forms = $('back-forms');
  const extra = card.plural ? 'мн. ч.: ' + card.plural : (card.forms || '');
  forms.textContent = extra;
  forms.hidden = !extra;
  $('back-tr').textContent = card.back;
  $('back-gram').textContent = card.grammar || '';
  $('back-gram').hidden = !card.grammar;
  const ex = $('back-example');
  ex.hidden = !card.example;
  if (card.example) ex.innerHTML = '<b>Пример:</b> ' + esc(card.example);
  $('chip-back').textContent = learned ? '✓ Изучено' : 'Ответ';
  $('chip-back').classList.toggle('learned', learned);

  const star = $('btn-star');
  star.classList.toggle('on', starredSet.has(card.front));
  $('btn-know').classList.toggle('on', learned);

  $('card-counter').innerHTML = `<b>${currentIndex + 1}</b> / ${currentCards.length}`;
  $('progress-fill').style.width = ((currentIndex + 1) / currentCards.length * 100) + '%';
}
function toggleFlip() {
  if (!currentCards.length) return;
  const flip = $('flip');
  flip.classList.remove('no-tr');
  isFlipped = !isFlipped;
  flip.classList.toggle('back', isFlipped);
  haptic(8);
}
function nextCard() {
  if (!currentCards.length) return;
  currentIndex = currentIndex < currentCards.length - 1 ? currentIndex + 1 : 0;
  renderCard('next');
}
function prevCard() {
  if (!currentCards.length) return;
  currentIndex = currentIndex > 0 ? currentIndex - 1 : currentCards.length - 1;
  renderCard('prev');
}
function toggleStar() {
  if (!currentCards.length) return;
  const key = currentCards[currentIndex].front;
  const on = !starredSet.has(key);
  on ? starredSet.add(key) : starredSet.delete(key);
  haptic(10);
  saveState();
  if (onlyFav && !on) {          // убрали из избранного, пока открыт фильтр «Избранное»
    rebuildCurrent();
    renderCard('next');
  } else {
    renderCard();
    play($('btn-star'), [{ transform: 'scale(.7)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 380 });
  }
}
function toggleLearned(learned) {
  if (!currentCards.length) return;
  const key = currentCards[currentIndex].front;
  learned ? learnedSet.add(key) : learnedSet.delete(key);
  haptic(learned ? 18 : 8);
  saveState();
  if (learned) {
    const p = deckProgress(decks[activeDeckId]);
    if (p.done === p.total) { showToast('Лекция выучена 🎉'); confetti(); }
  }
  nextCard();
}
function setOnlyFav(v) {
  onlyFav = v;
  $('btn-fav').setAttribute('aria-pressed', String(v));
  currentIndex = 0;
  rebuildCurrent();
  renderCard('next');
  renderListView();
}

// ============================================================ список
const ICON_SPEAK = '<svg class="i" viewBox="0 0 24 24"><path d="M5.6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h1.6l4.7-4.7c.6-.6 1.7-.2 1.7.7v14c0 .9-1.1 1.3-1.7.7zM15.5 8.5a5 5 0 0 1 0 7"/></svg>';
function renderListView() {
  const box = $('list-container');
  const q = ($('list-search').value || '').toLowerCase().trim();
  const list = cardsData.filter(c => (!onlyFav || starredSet.has(c.front)) &&
    (!q || c.front.toLowerCase().includes(q) || c.back.toLowerCase().includes(q) || (c.plural && c.plural.toLowerCase().includes(q)) || (c.forms && c.forms.toLowerCase().includes(q))));
  $('list-count').textContent = `Показано: ${list.length} из ${cardsData.length}`;
  if (!list.length) { box.innerHTML = '<div class="empty" style="grid-column:1/-1">Ничего не найдено</div>'; return; }
  box.innerHTML = list.map((c, i) => {
    const learned = learnedSet.has(c.front);
    const sub = c.plural ? 'мн. ч.: ' + c.plural : (c.forms || '');
    return `<article class="row in" style="--i:${Math.min(i, 14)}">
      <div class="row-head"><div><h4>${esc(c.front)}</h4>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}</div>
        <button class="icon-btn" type="button" data-speak="${esc(c.front)}" aria-label="Озвучить">${ICON_SPEAK}</button></div>
      <div class="row-foot"><span class="rtr">${esc(c.back)}</span>${learned ? '<span class="tick">✓ изучено</span>' : ''}</div>
    </article>`;
  }).join('');
}

// ============================================================ тест
let quizQuestions = [], quizIndex = 0, quizScore = 0, quizResults = [];
function startQuiz() {
  const pool = cardsData.length ? cardsData : [];
  const shuffled = [...pool].sort(() => Math.random() - .5);
  quizQuestions = shuffled.slice(0, Math.min(10, shuffled.length));
  quizIndex = 0; quizScore = 0; quizResults = [];
  renderQuizQuestion();
}
function renderDots() {
  $('quiz-dots').innerHTML = quizQuestions.map((_, i) => `<i class="${quizResults[i] || (i === quizIndex ? 'cur' : '')}"></i>`).join('');
}
function renderQuizQuestion() {
  const body = $('quiz-body');
  const total = quizQuestions.length;
  if (total < 2) { body.innerHTML = '<div class="empty">В этой лекции слишком мало слов для теста</div>'; $('quiz-dots').innerHTML = ''; return; }
  if (quizIndex >= total) { renderQuizResult(); return; }
  renderDots();
  const q = quizQuestions[quizIndex];
  const distractors = cardsData.filter(c => c.back !== q.back).sort(() => Math.random() - .5).slice(0, 3);
  const options = [q, ...distractors].sort(() => Math.random() - .5);
  body.innerHTML = `
    <div class="q-card"><p class="eyebrow" style="color:var(--muted)">Вопрос ${quizIndex + 1} из ${total}</p>
      <h2 class="word${getFrontQuestionText(q).length > 14 ? ' long' : ''}">${esc(getFrontQuestionText(q))}</h2>
      <span class="forms" id="quiz-forms" style="visibility:hidden">·</span></div>
    <div class="opts">${options.map(o => `<button class="opt" type="button" data-ok="${o.back === q.back}">${esc(o.back)}</button>`).join('')}</div>
    <button class="btn primary" id="quiz-next" type="button" hidden>${quizIndex + 1 === total ? 'Результат' : 'Дальше'}</button>`;
  play(body.firstElementChild, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 280 });
  body.querySelectorAll('.opt').forEach((btn, i) => play(btn, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 280, delay: 60 + i * 45 }));
}
function answerQuiz(btn) {
  const q = quizQuestions[quizIndex];
  const ok = btn.dataset.ok === 'true';
  const body = $('quiz-body');
  body.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.ok === 'true') b.classList.add('ok'); });
  if (!ok) btn.classList.add('bad');
  quizResults[quizIndex] = ok ? 'ok' : 'bad';
  if (ok) quizScore++;
  haptic(ok ? 14 : [10, 40, 10]);
  const word = body.querySelector('.word');
  word.textContent = q.front;
  word.classList.toggle('long', q.front.length > 14);
  const f = $('quiz-forms');
  f.textContent = q.plural ? 'мн. ч.: ' + q.plural : (q.forms || '');
  f.style.visibility = f.textContent ? 'visible' : 'hidden';
  renderDots();
  $('quiz-next').hidden = false;
  play($('quiz-next'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 240 });
}
function renderQuizResult() {
  const total = quizQuestions.length;
  const ratio = quizScore / total;
  $('quiz-dots').innerHTML = quizQuestions.map((_, i) => `<i class="${quizResults[i] || ''}"></i>`).join('');
  $('quiz-body').innerHTML = `<div class="result">
      <div class="ring" style="--p:0" id="res-ring"><span>${quizScore}/${total}</span></div>
      <h2>${ratio >= .8 ? 'Отлично!' : ratio >= .5 ? 'Хорошая работа' : 'Нужно ещё потренироваться'}</h2>
      <p>${quizScore} из ${total} правильно</p>
      <button class="btn primary" id="quiz-again" type="button" style="width:100%">Ещё раз</button>
    </div>`;
  requestAnimationFrame(() => $('res-ring') && $('res-ring').style.setProperty('--p', ratio.toFixed(3)));
  play($('quiz-body').firstElementChild, [{ opacity: 0, transform: 'scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 320 });
  if (ratio >= .8) { confetti(); haptic([20, 60, 20]); }
}

// ============================================================ глаголы
let verbFilter = 'all';
function speakVerbAllForms(idx) {
  const v = strongVerbsData[idx];
  if (!v) return;
  const c = s => s.split('/')[0].replace(/\(.*?\)/g, '').trim();
  speakText(`${v.infinitiv.replace(/\(.*?\)/g, '').trim()}, ${c(v.praesens)}, ${c(v.imperfekt)}, ${c(v.partizip2)}`);
}
function openSingleVerbInCard(idx) {
  const v = strongVerbsData[idx];
  if (!v) return;
  switchDeck(STRONG_ID);
  const i = currentCards.findIndex(c => c.front === v.front);
  if (i >= 0) { currentIndex = i; renderCard(); }
  setView('cards');
}
function renderVerbsTab() {
  const box = $('verbs-list-container');
  const q = ($('verbs-search').value || '').toLowerCase().trim();
  const list = [];
  strongVerbsData.forEach((v, idx) => {
    if (verbFilter === 'haben' && v.hilfsverb !== 'haben') return;
    if (verbFilter === 'sein' && v.hilfsverb !== 'sein') return;
    if (verbFilter === 'both' && !v.hilfsverb.includes('/')) return;
    if (verbFilter === 'variants' && !/[()/]/.test(v.praesens + v.imperfekt + v.partizip2)) return;
    if (q && !(String(v.num).includes(q) || [v.infinitiv, v.translation, v.praesens, v.imperfekt, v.partizip2, v.hilfsverb].some(s => s.toLowerCase().includes(q)))) return;
    list.push([v, idx]);
  });
  $('verbs-count').textContent = `Показано: ${list.length} из ${strongVerbsData.length}`;
  if (!list.length) { box.innerHTML = '<div class="empty" style="grid-column:1/-1">Глаголы не найдены</div>'; return; }
  box.innerHTML = list.map(([v, idx], i) => {
    const cls = v.hilfsverb === 'sein' ? 'badge sein' : v.hilfsverb.includes('/') ? 'badge both' : 'badge';
    return `<article class="row in" style="--i:${Math.min(i, 14)}">
      <div class="row-head"><div><h4><span class="num">#${v.num}</span>${esc(v.infinitiv)}</h4><p class="rtr">${esc(v.translation)}</p></div>
        <button class="icon-btn" type="button" data-verb-speak="${idx}" aria-label="Озвучить формы">${ICON_SPEAK}</button></div>
      <div class="vforms"><div class="vf"><span>Präsens</span><b>${esc(v.praesens)}</b></div><div class="vf"><span>Imperfekt</span><b>${esc(v.imperfekt)}</b></div><div class="vf"><span>Partizip II</span><b>${esc(v.partizip2)}</b></div></div>
      <div class="row-foot"><span class="${cls}">Hilfsverb: ${esc(v.hilfsverb)}</span><button class="btn" type="button" data-verb-card="${idx}" style="min-height:36px;padding:0 14px;font-size:13px">В карточки</button></div>
    </article>`;
  }).join('');
}

// ============================================================ разделы и нижняя панель
function moveIndicator() {
  const tab = document.querySelector('.tab[aria-current="page"]');
  const ind = $('tab-ind');
  if (!tab || !ind) return;
  ind.style.width = tab.offsetWidth + 'px';
  ind.style.transform = `translateX(${tab.offsetLeft}px)`;
}
function setView(name) {
  const prev = currentView;
  currentView = name;
  ['cards', 'quiz', 'list', 'verbs'].forEach(v => $('view-' + v).classList.toggle('on', v === name));
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.view === name ? 'page' : 'false'));
  moveIndicator();
  if (name === 'cards') renderCard();
  if (name === 'quiz') startQuiz();
  if (name === 'list') renderListView();
  if (name === 'verbs') renderVerbsTab();
  document.querySelector('.decks-wrap').hidden = name === 'verbs';
  if (prev !== name) {
    const el = $('view-' + name);
    play(el, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
}

// ============================================================ события
$('decks').addEventListener('click', e => {
  const b = e.target.closest('[data-deck]');
  if (b) { haptic(8); switchDeck(b.dataset.deck); }
});
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) { haptic(8); setView(t.dataset.view); }
});
$('scene').addEventListener('click', toggleFlip);
$('btn-next').addEventListener('click', nextCard);
$('btn-prev').addEventListener('click', prevCard);
$('btn-star').addEventListener('click', e => { e.stopPropagation(); toggleStar(); });
$('btn-speak').addEventListener('click', e => { e.stopPropagation(); if (currentCards.length) speakText(getFrontQuestionText(currentCards[currentIndex])); });
$('btn-speak-back').addEventListener('click', e => { e.stopPropagation(); if (currentCards.length) speakText(currentCards[currentIndex].front); });
$('btn-know').addEventListener('click', () => toggleLearned(true));
$('btn-repeat').addEventListener('click', () => toggleLearned(false));
$('btn-fav').addEventListener('click', () => setOnlyFav(!onlyFav));
$('list-search').addEventListener('input', renderListView);
$('verbs-search').addEventListener('input', renderVerbsTab);
$('verb-filters').addEventListener('click', e => {
  const b = e.target.closest('[data-vf]');
  if (!b) return;
  verbFilter = b.dataset.vf;
  document.querySelectorAll('#verb-filters .pill').forEach(p => p.setAttribute('aria-selected', String(p === b)));
  renderVerbsTab();
});
$('btn-verbs-cards').addEventListener('click', () => { switchDeck(STRONG_ID); setView('cards'); });
$('btn-verbs-quiz').addEventListener('click', () => { switchDeck(STRONG_ID); setView('quiz'); });
document.addEventListener('click', e => {
  const sp = e.target.closest('[data-speak]');
  if (sp) { speakText(sp.dataset.speak); return; }
  const vs = e.target.closest('[data-verb-speak]');
  if (vs) { speakVerbAllForms(+vs.dataset.verbSpeak); return; }
  const vc = e.target.closest('[data-verb-card]');
  if (vc) { openSingleVerbInCard(+vc.dataset.verbCard); return; }
  const opt = e.target.closest('.opt');
  if (opt && !opt.disabled) { answerQuiz(opt); return; }
  if (e.target.closest('#quiz-next')) { quizIndex++; renderQuizQuestion(); return; }
  if (e.target.closest('#quiz-again')) { startQuiz(); }
});
window.addEventListener('resize', moveIndicator);
window.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (currentView !== 'cards') return;
  if (e.code === 'Space') { e.preventDefault(); toggleFlip(); }
  else if (e.code === 'ArrowRight') nextCard();
  else if (e.code === 'ArrowLeft') prevCard();
});

// свайп по карточке
let touchX = 0, touchY = 0;
$('scene').addEventListener('touchstart', e => { const t = e.changedTouches[0]; touchX = t.screenX; touchY = t.screenY; }, { passive: true });
$('scene').addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.screenX - touchX, dy = t.screenY - touchY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) { dx < 0 ? nextCard() : prevCard(); }
}, { passive: true });

// старт
initStorageAndRestore().then(() => {
  moveIndicator();
  play(document.querySelector('header .inner'), [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 400 });
  play($('view-cards'), [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 80 });
});

  </script>
